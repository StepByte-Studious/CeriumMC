[workspace]
resolver = "3"
members = [
    "crates/cerium-util",
    "crates/cerium-nbt",
    "crates/cerium-codec",
    "crates/cerium-protocol",
    "crates/cerium-registry",
    "crates/cerium-world",
    "crates/cerium-worldgen",
    "crates/cerium-entity",
    "crates/cerium-harness",
    "crates/cerium-server",
    "crates/cerium-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StepByte-Studious/CeriumMC"
homepage = "https://github.com/StepByte-Studious/CeriumMC"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
