name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  # Downloads and verifies the pinned vanilla jar, then produces the data
  # generator reports that the build scripts read. The reports are derived
  # from Mojang's game: they are shared with other jobs only through the
  # Actions cache and are never uploaded as artifacts.
  vanilla:
    name: Vanilla jar and reports
    runs-on: ubuntu-latest
    outputs:
      reports-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - name: Lint scripts
        run: shellcheck -x scripts/*.sh
      - name: Compute the reports cache key
        id: key
        run: echo "key=vanilla-reports-${{ hashFiles('vanilla.toml', 'scripts/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the vanilla jar
        uses: actions/cache@v4
        with:
          path: .vanilla/*.jar
          key: vanilla-jar-${{ hashFiles('vanilla.toml') }}
      - name: Fetch and verify the pinned server jar
        run: bash scripts/fetch-vanilla.sh
      - name: Restore the reports
        id: reports
        uses: actions/cache/restore@v4
        with:
          path: .vanilla/reports
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true
      - uses: actions/setup-java@v5
        if: steps.reports.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "25"
      - name: Generate and verify the reports
        if: steps.reports.outputs.cache-hit != 'true'
        run: bash scripts/gen-reports.sh
      - name: Save the reports
        if: steps.reports.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vanilla/reports
          key: ${{ steps.key.outputs.key }}
          enableCrossOsArchive: true

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: vanilla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vanilla-reports
        with:
          key: ${{ needs.vanilla.outputs.reports-key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Cargo.lock is not Mojang data, so it is safe to publish. It lets the
      # lockfile be committed without a local Rust toolchain.
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  docs:
    name: Docs
    needs: vanilla
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vanilla-reports
        with:
          key: ${{ needs.vanilla.outputs.reports-key }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  msrv:
    name: MSRV (1.85)
    needs: vanilla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vanilla-reports
        with:
          key: ${{ needs.vanilla.outputs.reports-key }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  native:
    name: ${{ matrix.name }}
    needs: vanilla
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run-tests: true
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run-tests: true
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            run-tests: true
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            run-tests: true
          # Cross-compiled on the Apple Silicon runner; tests are built but not run.
          - name: macOS x86_64 (build only)
            os: macos-latest
            target: x86_64-apple-darwin
            run-tests: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vanilla-reports
        with:
          key: ${{ needs.vanilla.outputs.reports-key }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --all-targets --target ${{ matrix.target }}
      - name: Test
        if: matrix.run-tests
        run: cargo test --workspace --target ${{ matrix.target }}

  cross:
    name: ${{ matrix.name }}
    needs: vanilla
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Raspberry Pi armv7 (QEMU)
            target: armv7-unknown-linux-gnueabihf
          - name: Android aarch64 (QEMU)
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/vanilla-reports
        with:
          key: ${{ needs.vanilla.outputs.reports-key }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Test
        run: cross test --workspace --target ${{ matrix.target }}

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  ci-success:
    name: CI success
    if: always()
    needs: [vanilla, fmt, clippy, docs, msrv, native, cross, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more jobs did not succeed."
            exit 1
          fi
